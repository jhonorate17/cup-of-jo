<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blender Journal · Cup of Jo</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <div class="nav-inner nav-triptych">
  
      <a href="../index.html" class="nav-logo-left">
<canvas id="logo-canvas"
  data-model="../models/jo.glb">
</canvas>
      </a>
  
      <span class="nav-wordmark-center">Cup of Jo</span>
  
      <div class="nav-links">
        <a href="../projects.html" class="active">Projects</a>
        <a href="../about.html">About</a>
      </div>
  
    </div>
  </nav>

  <main class="container">

    <div class="journal-header">
      <h1>Summer Internship · The Journey</h1>
    </div>

    <div class="journal-entry-nav" id="journal-entry-nav"></div>

    <div class="journal-wrap">
      <div class="journal-images">
        <img id="journal-main-img" class="journal-main-img" src="" alt="">
        <div class="journal-thumbs" id="journal-thumbs"></div>
      </div>

      <div class="journal-text" id="journal-text"></div>
    </div>

    <div class="back-link">
      <a href="../projects.html">← Back to Projects</a>
    </div>

  </main>

  <script>
    const entries = [
      {
        number: 'Instagram: @jogyokuro',
        title: 'A Slice of Summer Life',
        date: 'Jun 2026 - Aug 2026',
        images: ['../images/proj11.png','../images/proj12.png','../images/proj13.png','../images/proj14.png'], 
        content:`
A special post this time, a little outside the usual! <br>
This summer I had the opportunity to intern with Lavner Education at the British International School of Chicago, teaching 3D printing, 3D modeling, and game design to students of all ages and skill levels. So thankful to both organizations for having me. <br> <br>
It was a genuinely exciting environment to be in. Teaching 3D modeling and teaching 3D printing gave me a new appreciation for all its little rules and caveats you stop noticing once they become habit.
Childcare has its hurdles, but getting to teach the next generation about something you love is genuinely rewarding. <br><br>
I got to say though, what I'm especially proud of is that every day after work I came back and kept practicing. This summer turned out to be one of my most productive periods yet in my own 3D art journey. Character creation, rigging, lighting, and scene creation all got serious attention, and I feel like the growth was real and meaningful. Balancing a full teaching role while continuing to push my own craft was something I wasn't sure I could pull off, but I did!!!
Living in Chicago this summer was a wild, wonderful experience. So much came out of this season, in the classroom, in Blender, and personally. Endlessly thankful for the people I met along the way!
      `}
    ];

    let current = 0;

    const mainImg    = document.getElementById('journal-main-img');
    const thumbsWrap = document.getElementById('journal-thumbs');
    const textWrap   = document.getElementById('journal-text');
    const entryNav   = document.getElementById('journal-entry-nav');


    function updateEntryNav(index) {
      entryNav.querySelectorAll('button').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
    }

    function renderEntry(index) {
      current = index;
      const entry = entries[index];

      mainImg.src = entry.images[0];
      mainImg.alt = entry.title;

      thumbsWrap.innerHTML = '';
      entry.images.forEach((src, i) => {
        const img = document.createElement('img');
        img.src = src;
        img.alt = `View ${i + 1}`;
        if (i === 0) img.classList.add('active');
        img.addEventListener('click', () => {
          mainImg.src = src;
          thumbsWrap.querySelectorAll('img').forEach(t => t.classList.remove('active'));
          img.classList.add('active');
        });
        thumbsWrap.appendChild(img);
      });

      textWrap.innerHTML = `
        <h2 class="journal-entry-title">${entry.title}</h2>
        <span class="journal-date">${entry.date}</span>
        <div class="journal-body">${entry.content}</div>
        ${entry.extra || ''}
      `;
      textWrap.classList.remove('fade-in');
      void textWrap.offsetWidth;
      textWrap.classList.add('fade-in');

      updateEntryNav(index);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Renders the first element in the reversed list (Entry X)
    renderEntry(0);
  </script>

  <script type="module" src="../js/logo3d.js"></script>
</body>
</html>
