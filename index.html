<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cup of Jo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .home-wrap {
      padding: 1.5rem 2rem 2rem;
      display: flex;
      justify-content: center;
    }
    .home-scene {
      position: relative;
      width: 100%;
      max-width: 1500px;
      border-radius: 8px;
      overflow: hidden;
    }
    .home-scene img.bg-main {
      width: 100%;
      display: block;
      border-radius: 8px;
    }
    .hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 6px;
      background: none;
      border: none;
      transition: background 0.2s, box-shadow 0.2s;
      
      /* Synchronized periodic glow loop */
      animation: periodic-glow 2s ease-in-out infinite;
    }
    
    .hotspot:hover, .hotspot.mobile-active {
      background: rgba(255,255,255,0.12) !important;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.3) !important;
      animation-play-state: paused; 
    }

    /* Coordinated slow pulse animation keyframe (FIXED SYNTAX) */
    @keyframes periodic-glow {
      0%, 100% {
        box-shadow: 0 0 0 0px rgba(255, 255, 255, 0);
        background: rgba(255, 255, 255, 0);
      }
      70% {
        box-shadow: 0 0 12px 2px rgba(226, 211, 174, 0.35);
        background: rgba(157, 133, 62, 0.05);
      }
      85% {
        box-shadow: 0 0 12px 2px rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.05);
      }
    }

    .hotspot-label {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #fff;
      background: rgba(0,0,0,0.55);
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 10;
    }
    .hotspot-label.visible { opacity: 1; }

    /* ── ME overlay ── */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75); 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem; 
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .hero-overlay.visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
    }
    .overlay-img {
      max-width: 40%;
      max-height: 70%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .hero-desc {
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      max-width: 480px;
      line-height: 1.6;
      text-align: left; 
    }

    /* Responsive adjustment for smaller screens */
    @media (max-width: 768px) {
      .hero-overlay {
        flex-direction: column;
        gap: 1rem;
      }
      .overlay-img {
        max-width: 60%;
        max-height: 40%;
      }
      .hero-desc {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner nav-triptych">
      <a href="index.html" class="nav-logo-left">
        <canvas id="logo-canvas"></canvas>
      </a>
      <span class="nav-wordmark-center">Cup of Jo</span>
      <div class="nav-links">
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </nav>

  <div class="home-wrap">
    <div class="home-scene">
      <img src="./images/coffeeshop-bg.png" class="bg-main" alt="Cup of Jo coffee shop">

      <a class="hotspot" data-label="BROWSE PROJECTS" href="projects.html"
         style="left: 73%; top: 79%; width: 16%; height: 17%;"></a>

      <a class="hotspot" data-label="ABOUT ME" href="about.html"
         style="left: 2%; top: 59%; width: 13%; height: 22%;"></a>

      <button class="hotspot" id="antenna-hotspot" data-label="MY SKILLS"
         style="left: 41%; top: 19%; width: 6%; height: 11%;"></button>

      <div class="hero-overlay" id="hero-overlay">
        <img src="images/heroone.png" class="overlay-img" alt="Skills Graphic">
        
        <p class="hero-desc">
          UNCA New Media major <br>Computer Science minor <br><br>· 3D Modeling <br>· 3D Printing <br>· Interactive Code <br>· Web Design
        </p>
      </div>
    </div>
  </div>

  <div class="hotspot-label" id="hotspot-label"></div>

  <script>
    const label = document.getElementById('hotspot-label');
    const hotspots = document.querySelectorAll('.hotspot');

    hotspots.forEach(spot => {
      // DESKTOP: Hover handlers
      spot.addEventListener('mouseenter', () => {
        label.textContent = spot.dataset.label;
        label.classList.add('visible');
      });
      
      spot.addEventListener('mouseleave', () => {
        label.classList.remove('visible');
        spot.classList.remove('mobile-active');
      });

      // MOBILE & TOUCH: Intercept single taps
      spot.addEventListener('click', (e) => {
        // Only run this logic if it's a touch display scenario 
        // Checking window.matchMedia lets us protect default desktop behavior
        if (window.matchMedia("(max-width: 768px)").matches) {
          
          // If this specific hotspot isn't active yet
          if (!spot.classList.contains('mobile-active')) {
            e.preventDefault(); // Stop the link from firing immediately
            e.stopPropagation();

            // Clear any previously tapped hotspots first
            hotspots.forEach(h => h.classList.remove('mobile-active'));
            
            // Activate current hotspot, update text, and show label
            spot.classList.add('mobile-active');
            label.textContent = spot.dataset.label;
            label.classList.add('visible');
          }
          // If it is ALREADY active, let the click pass through natively (goes to page)
        }
      });
    });

    // Clear labels if the user taps anywhere on the background image map
    document.querySelector('.home-scene').addEventListener('click', (e) => {
      if (!e.target.classList.contains('hotspot')) {
        label.classList.remove('visible');
        hotspots.forEach(h => h.classList.remove('mobile-active'));
      }
    });

    const heroOverlay = document.getElementById('hero-overlay');
    const antennaBtn = document.getElementById('antenna-hotspot');

    antennaBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      heroOverlay.classList.add('visible');
    });

    heroOverlay.addEventListener('click', () => {
      heroOverlay.classList.remove('visible');
      label.classList.remove('visible');
      antennaBtn.classList.remove('mobile-active');
    });
  </script>

  <script type="module" src="js/logo3d.js"></script>
</body>
</html>
